
<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>La Dulceteria</title>
  <meta name="description" content="Consulta el estado de cuenta escolar de La Dulceteria.">
  <meta name="theme-color" content="#f7b8d5">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="La Dulceteria">

  <link rel="manifest" href="./manifiesto.webmanifiesto">
  <link rel="icon" href="./descargar.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./dulceteria_icon_180.png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff8fc;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #49334b;
    }

    main {
      width: 100%;
      max-width: 360px;
    }

    .logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin-bottom: 16px;
    }

    h1 {
      color: #d94691;
      font-size: 27px;
      margin: 8px 0;
    }

    p {
      line-height: 1.5;
      margin: 12px 0 24px;
    }

    .boton {
      display: block;
      padding: 16px 20px;
      border-radius: 16px;
      background: #e94b9b;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }

    .nota {
      font-size: 13px;
      color: #766779;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="./dulceteria_icon_180.png"
      alt="La Dulceteria Tiendita Escolar"
    >

    <h1>¡Hola!</h1>
    <p>Consulta fácil y rápidamente el estado de cuenta escolar de tu peque.</p>

    <a
      class="boton"
      href="https://script.google.com/macros/s/AKfycbxL42LZ7UmJ5btIKuOi8eqmq1IXQZ3_bG9dH_qQoElVwJJG-kwssK1fY0e4WzvvQ6EO/exec"
    >
      Consultar mi estado de cuenta
    </a>

    <p class="nota">La Dulceteria Tiendita Escolar 💗</p>
  </main>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
