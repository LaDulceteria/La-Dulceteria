
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#fff5f9;margin:0;padding:12px;color:#19375b}
    .card{max-width:480px;margin:10px auto;background:white;padding:20px;border-radius:16px;box-shadow:0 4px 18px #0001}
    .logo{text-align:center;margin-bottom:10px}
    .logo img{display:block;width:190px;max-width:80%;height:auto;margin:0 auto}
    h1{font-size:27px;text-align:center;margin:6px 0}
    h2{font-size:21px;margin:8px 0}
    p{color:#596579;line-height:1.4;margin:6px 0}
    .intro{text-align:center;margin-bottom:12px}
    label{display:block;margin-top:12px;margin-bottom:4px;font-weight:bold}
    input{width:100%;padding:11px;border:1px solid #e8cbd8;border-radius:8px;font-size:16px;background:#fff;color:#19375b}
    button{width:100%;margin-top:14px;padding:12px;background:#ff3d91;color:white;border:0;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
    button:hover{background:#e92b7e}
    button:disabled{opacity:.65;cursor:wait}
    #resultado{margin-top:16px}
    .estado{background:#fff0f6;padding:15px;border-radius:12px;overflow-wrap:anywhere}
    .estado h2{color:#19395d;margin:4px 0 10px}
    .saldo{color:#ff2f87!important;font-size:23px;margin:10px 0!important}
    .seccion{border-top:1px solid #e6cbd7;margin-top:12px;padding-top:10px}
    .seccion h3{color:#19395d;margin:4px 0 8px}
    .fecha{margin-top:10px}
    .movimientos{overflow-x:auto;width:100%;margin-top:12px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:7px 4px;border-bottom:1px solid #eadde3;overflow-wrap:anywhere}
    th{color:#19375b}
    .actualizado{color:#64748b;font-size:12px}
    .nota{font-size:12px;color:#64748b}
    .oculto{display:none!important}
    .estado-solicitud{padding:10px;background:#fff;border-radius:8px;margin-top:10px;overflow-wrap:anywhere}
    @media(max-width:380px){.card{padding:14px}.estado{padding:12px}.saldo{font-size:20px}}
  </style>
</head>

<body>
<main class="card">
  <div class="logo">
    <img
      src="https://drive.google.com/thumbnail?id=1ThKBTPViig6czRJpXm9G9Jq7BzfxFBTR&sz=w500"
      alt="La Dulceteria Tiendita Escolar"
      onerror="this.style.display='none';">
  </div>

  <h1>La Dulceteria</h1>
  <h2 style="text-align:center;">Mi cuenta escolar</h2>

  <p class="intro">
    Consulta tu saldo con los datos que te entregó la tiendita escolar.
  </p>

  <form id="consulta">
    <label for="cuenta">Número de cuenta</label>
    <input id="cuenta" required autocomplete="off">

    <label for="codigo">Código privado de consulta</label>
    <input id="codigo" type="password" required autocomplete="off">

    <button type="submit" id="boton">
      Ver mi estado de cuenta
    </button>
  </form>

  <div id="resultado" role="status"></div>
</main>

<script>
let cuentaValidada = '';

document.getElementById('consulta').addEventListener('submit', function(e) {
  e.preventDefault();

  const cuenta = document.getElementById('cuenta').value.trim();
  const codigo = document.getElementById('codigo').value.trim();
  const resultado = document.getElementById('resultado');
  const boton = document.getElementById('boton');

  resultado.textContent = 'Consultando cuenta...';
  boton.disabled = true;

  google.script.run
    .withSuccessHandler(function(datos) {
      cuentaValidada = cuenta;

      resultado.innerHTML = `
        <div class="estado">
          <h2>Estado de cuenta escolar</h2>
          <p><strong>Alumno:</strong> ${escapar(datos.name)}</p>
          <p><strong>Cuenta:</strong> ${escapar(datos.account)}</p>
          <p><strong>Grupo:</strong> ${escapar(datos.group)}</p>

          <div class="seccion">
            <p>Saldo inicial:
              <strong>$${Number(datos.starting).toFixed(2)}</strong>
            </p>
            <p>Total de depósitos:
              <strong>$${Number(datos.depositsTotal).toFixed(2)}</strong>
            </p>
            <p>Total de compras:
              <strong>$${Number(datos.purchasesTotal).toFixed(2)}</strong>
            </p>
            <h2 class="saldo">
              Saldo disponible: $${Number(datos.balance).toFixed(2)}
            </h2>
            <p class="actualizado">
              Actualizado: ${escapar(datos.updatedAt)}
            </p>
          </div>

          <div class="seccion">
            <h3>Reportar depósito</h3>
            <p>
              Adjunta el comprobante de una transferencia realizada.
              El saldo no cambiará hasta que La Dulceteria autorice el depósito.
            </p>

            <form id="formDeposito" onsubmit="enviarDeposito(event)">
              <label for="montoDeposito">Monto depositado (MXN)</label>
              <input
                id="montoDeposito"
                type="number"
                min="0.01"
                max="1000000"
                step="0.01"
                required
                placeholder="Ej. 250.00">

              <label for="comprobante">Comprobante (foto o PDF, máximo 5 MB)</label>
              <input
                id="comprobante"
                type="file"
                accept="image/jpeg,image/png,image/webp,application/pdf"
                required>

              <button type="submit" id="botonDeposito">
                Enviar solicitud de depósito
              </button>
            </form>

            <div
              id="estadoDeposito"
              class="estado-solicitud oculto"
              role="status">
            </div>
          </div>

          <div class="seccion">
            <h3>Mis movimientos</h3>
            <p>Selecciona el periodo que deseas consultar.</p>

            <div class="fecha">
              <label for="fechaDesde">Desde:</label>
              <input type="date" id="fechaDesde">
            </div>

            <div class="fecha">
              <label for="fechaHasta">Hasta:</label>
              <input type="date" id="fechaHasta">
            </div>

            <button
              type="button"
              id="botonMovimientos"
              onclick="consultarMovimientos()">
              VER MIS MOVIMIENTOS
            </button>

            <div id="resultadoMovimientos" class="movimientos"></div>
          </div>
        </div>
      `;

      boton.disabled = false;
    })
    .withFailureHandler(function() {
      resultado.textContent =
        'No se pudo consultar la cuenta. Verifica los datos o contacta a la tiendita.';
      boton.disabled = false;
    })
    .consultarCuenta(cuenta, codigo);
});

function escapar(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c];
  });
}

function enviarDeposito(e) {
  e.preventDefault();

  const cuenta = document.getElementById('cuenta').value.trim();
  const codigo = document.getElementById('codigo').value.trim();
  const monto = document.getElementById('montoDeposito').value;
  const archivo = document.getElementById('comprobante').files[0];
  const boton = document.getElementById('botonDeposito');
  const estado = document.getElementById('estadoDeposito');

  if (!archivo) {
    estado.textContent = 'Adjunta el comprobante.';
    estado.classList.remove('oculto');
    return;
  }

  if (archivo.size > 5 * 1024 * 1024) {
    estado.textContent =
      'El archivo supera 5 MB. Selecciona uno más pequeño.';
    estado.classList.remove('oculto');
    return;
  }

  boton.disabled = true;
  estado.textContent = 'Enviando solicitud...';
  estado.classList.remove('oculto');

  const reader = new FileReader();

  reader.onload = function() {
    const data = String(reader.result).split(',')[1];

    google.script.run
      .withSuccessHandler(function(res) {
        estado.textContent =
          res.mensaje + ' Folio: ' + res.folio;

        document.getElementById('formDeposito').reset();
        boton.disabled = false;
      })
      .withFailureHandler(function(err) {
        estado.textContent =
          err && err.message
            ? err.message
            : 'No se pudo enviar la solicitud. Intenta de nuevo.';

        boton.disabled = false;
      })
      .registrarSolicitudDeposito(
        cuenta,
        codigo,
        monto,
        archivo.name,
        archivo.type,
        data
      );
  };

  reader.onerror = function() {
    estado.textContent = 'No se pudo leer el archivo.';
    boton.disabled = false;
  };

  reader.readAsDataURL(archivo);
}

function consultarMovimientos() {
  const cuenta = document.getElementById('cuenta').value.trim();
  const codigo = document.getElementById('codigo').value.trim();
  const desde = document.getElementById('fechaDesde').value;
  const hasta = document.getElementById('fechaHasta').value;
  const resultado = document.getElementById('resultadoMovimientos');
  const boton = document.getElementById('botonMovimientos');

  if (!desde || !hasta) {
    resultado.textContent =
      'Selecciona la fecha inicial y la fecha final.';
    return;
  }

  if (desde > hasta) {
    resultado.textContent =
      'La fecha inicial no puede ser posterior a la final.';
    return;
  }

  resultado.textContent = 'Consultando movimientos...';
  boton.disabled = true;

  google.script.run
    .withSuccessHandler(function(movs) {
      resultado.replaceChildren();
      boton.disabled = false;

      if (!movs.length) {
        resultado.textContent =
          'No hay movimientos en ese periodo.';
        return;
      }

      const tabla = document.createElement('table');
      const encabezado = document.createElement('tr');

      ['Fecha', 'Operación', 'Concepto', 'Cant.', 'Importe']
        .forEach(function(t) {
          const th = document.createElement('th');
          th.textContent = t;
          encabezado.appendChild(th);
        });

      tabla.appendChild(encabezado);

      movs.forEach(function(m) {
        const fila = document.createElement('tr');

        [
          m.fecha,
          m.operacion,
          m.concepto,
          m.cantidad,
          '$' + Number(m.importe).toFixed(2)
        ].forEach(function(v) {
          const td = document.createElement('td');
          td.textContent = v;
          fila.appendChild(td);
        });

        tabla.appendChild(fila);
      });

      resultado.appendChild(tabla);
    })
    .withFailureHandler(function(err) {
      boton.disabled = false;
      resultado.textContent =
        err.message || 'No se pudieron consultar los movimientos.';
    })
    .consultarMovimientosPorFecha(
      cuenta,
      codigo,
      desde,
      hasta
    );
}
</script>
</body>
</html>
