
<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>La Dulceteria | Estado de cuenta</title>
  <meta name="description" content="Consulta fácil y rápida del estado de cuenta escolar de La Dulceteria Tiendita Escolar.">
  <meta name="theme-color" content="#F7B8D5">

  <!-- Configuración para iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="La Dulceteria">

  <!-- Manifiesto e iconos -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./descargar.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./dulceteria_icon_180.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #FFF8FC;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #FFF8FC 0%, #FDE8F2 100%);
      color: #49334B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      background: #FFFFFF;
      border-radius: 28px;
      box-shadow: 0 8px 28px rgba(180, 90, 140, 0.12);
    }

    .logo {
      display: block;
      width: 180px;
      height: 180px;
      object-fit: contain;
      margin: 0 auto 16px;
    }

    h1 {
      margin: 8px 0;
      color: #D94691;
      font-size: 28px;
      font-weight: 800;
    }

    .subtitulo {
      margin: 8px 0 24px;
      font-size: 16px;
      line-height: 1.6;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      background: #E94B9B;
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(233, 75, 155, 0.22);
    }

    .boton:active {
      opacity: 0.85;
    }

    .nota {
      margin: 20px 0 0;
      color: #806F82;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="logo"
      src="./dulceteria_icon_180.png"
      alt="Logotipo de La Dulceteria Tiendita Escolar"
    >

    <h1>¡Hola!</h1>

    <p class="subtitulo">
      Consulta fácil y rápidamente el estado de cuenta escolar de tu peque.
    </p>

    <a
      class="boton"
      href="https://script.google.com/macros/s/AKfycbxL42LZ7UmJ5btIKuOi8eqmq1IXQZ3_bG9dH_qQoElVwJJG-kwssK1fY0e4WzvvQ6EO/exec"
    >
      Consultar mi estado de cuenta
    </a>

    <p class="nota">
      La Dulceteria Tiendita Escolar 💗
    </p>
  </main>
</body>
</html>
